<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Girls and Women Foundation Liberia</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you are looking for cannot be found. Return to the GWOFO home page or explore our empowerment programs.">
    <!-- Favicon / Browser Tab Logo -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/gwofo-logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .error-section {
            padding: 80px 20px 100px;
            text-align: center;
            min-height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f9fafb 0%, #ffffff 100%);
        }
        .error-card {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 48px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .error-code {
            font-size: clamp(4.5rem, 12vw, 7.5rem);
            font-weight: 800;
            line-height: 1;
            color: #ff6b6b;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: #1f2937;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .error-desc {
            font-size: 1.05rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .error-btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: #ff6b6b;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .error-btn-primary:hover {
            background: #e65252;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 107, 0.3);
        }
        .error-btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            background: #f3f4f6;
            color: #374151;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .error-btn-secondary:hover {
            background: #e5e7eb;
            color: #111827;
        }
        .error-links {
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
            font-size: 0.92rem;
            color: #6b7280;
        }
        .error-links a {
            color: #ff6b6b;
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
        }
        .error-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>
    
    <!-- 404 Content Section -->
    <main class="error-section" role="main">
        <div class="container">
            <div class="error-card">
                <div class="error-code" aria-hidden="true">404</div>
                <h1 class="error-title">Page Not Found</h1>
                <p class="error-desc">The page you are looking for might have been moved, renamed, or is temporarily unavailable. Let's get you back on track.</p>
                <div class="error-actions">
                    <a href="/index.html" class="error-btn-primary"><i class="fas fa-home"></i> Return to Home</a>
                    <a href="/projects.html" class="error-btn-secondary"><i class="fas fa-hands-helping"></i> View Projects</a>
                </div>
                <div class="error-links">
                    <span>Popular pages:</span>
                    <a href="/about.html">About Us</a> •
                    <a href="/single.html">News & Stories</a> •
                    <a href="/contact.html">Contact</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/load.js"></script>
</body>
</html>
