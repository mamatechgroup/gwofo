[build]
  command = "echo 'Frontend ready for deployment'"
  publish = "."

# Canonical 301 Redirect: www -> apex domain
[[redirects]]
  from = "https://www.gwofoliberia.org/*"
  to = "https://gwofoliberia.org/:splat"
  status = 301
  force = true

# Canonical 301 Redirect: Netlify default subdomain -> apex domain
[[redirects]]
  from = "https://gwofo.netlify.app/*"
  to = "https://gwofoliberia.org/:splat"
  status = 301
  force = true

# Canonical 301 Redirect: /index.html -> /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Dynamic API Proxy: Route Netlify /api/* directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://api.gwofoliberia.org/api/:splat"
  status = 200
  force = true

# Canonical 301 Redirect: /admin/login.html -> /admin/login
[[redirects]]
  from = "/admin/login.html"
  to = "/admin/login"
  status = 301
  force = true

# Dynamic Sitemap Proxy: Route Netlify /sitemap.xml to Render backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.gwofoliberia.org/sitemap.xml"
  status = 200
  force = true

# Clean URLs (200 rewrites for extensionless URLs)
[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin/:page"
  to = "/admin/:page.html"
  status = 200

[[redirects]]
  from = "/single"
  to = "/single.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Dedicated 404 handler for missing pages (Prevents Soft 404)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Production API Configuration pointing to Render API Subdomain
[context.production.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

[context.branch-deploy.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

# Production CDN Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[dev]
  command = "echo 'Start your dev server locally'"
  port = 8000
