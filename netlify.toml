[build]
  command = "echo 'Frontend ready for deployment'"
  publish = "."

# Canonical 301 Redirect: www -> apex domain
[[redirects]]
  from = "https://www.gwofoliberia.org/*"
  to = "https://gwofoliberia.org/:splat"
  status = 301
  force = true

# Canonical 301 Redirect: Netlify default subdomain -> apex domain
[[redirects]]
  from = "https://gwofo.netlify.app/*"
  to = "https://gwofoliberia.org/:splat"
  status = 301
  force = true

# Dedicated 404 handler for missing pages (Prevents Soft 404)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Production API Configuration pointing to Render API Subdomain
[context.production.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

[context.deploy-preview.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

[context.branch-deploy.environment]
  VITE_API_URL = "https://api.gwofoliberia.org/api"
  REACT_APP_API_URL = "https://api.gwofoliberia.org/api"
  API_BASE_URL = "https://api.gwofoliberia.org/api"

# Production CDN Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[dev]
  command = "echo 'Start your dev server locally'"
  port = 8000
