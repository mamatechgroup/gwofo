services:
  - type: web
    name: gwofo-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://gwofoliberia.org,https://www.gwofoliberia.org
      - key: DATABASE_URL
        scope: run
        sync: false
    domains:
      - api.gwofoliberia.org
